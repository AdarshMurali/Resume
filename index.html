<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e3ac14" />
    <title>Adarsh Murali — Data Engineer, Capital Markets</title>
    <meta
      name="description"
      content="Interactive resume for Adarsh Murali — Data Engineer, Capital Markets. ETL, Python, Big Data, and applied AI across finance, energy, and background verification."
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("resume-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
